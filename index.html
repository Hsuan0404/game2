<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9f2ed">
<title>錢錢大冒險｜小小理財家</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
:root{--ink:#173a32;--green:#32836a;--lime:#d9ed83;--cream:#f4f4ec;--paper:#fffefa;--muted:#70857c;--line:#dfe8de;--orange:#ff9c58;--red:#db695b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,'Noto Sans TC',sans-serif}button{font:inherit;cursor:pointer;color:inherit}header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100% - 1120px)/2),20px);background:#f8f8f2;border-bottom:1px solid var(--line);font-weight:900}.brand{display:flex;align-items:center;gap:10px;font-size:18px}.brand i{font-style:normal;width:36px;height:36px;background:var(--lime);display:grid;place-items:center;border-radius:12px}.header-right{font-size:12px;color:var(--muted)}main{max-width:1120px;margin:auto;padding:28px 20px 55px}.intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.intro h1{font-size:34px;letter-spacing:-1px;margin:5px 0}.intro p{color:var(--muted);margin:0;font-size:14px}.tag{color:var(--green);font-size:11px;font-weight:900;letter-spacing:1.5px}.progress{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px}.step{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;color:var(--muted)}.step.active{background:var(--ink);color:#fff}.step.done{background:#e3efd8;color:var(--green);border-color:#cde0c5}.connector{width:20px;height:2px;background:var(--line)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}.game{border-radius:22px;background:var(--paper);border:1px solid var(--line);overflow:hidden;box-shadow:0 15px 40px #234d3a12}.scene{position:relative;height:365px;overflow:hidden;background:linear-gradient(#c6e9e8 0 59%,#9bc9a0 59%);isolation:isolate}.scene:before{content:'';position:absolute;bottom:0;left:0;right:0;height:45%;background:linear-gradient(160deg,#add69e,#78b888);clip-path:polygon(0 50%,20% 20%,38% 52%,64% 8%,100% 48%,100% 100%,0 100%);z-index:-1}.scene:after{content:'';position:absolute;bottom:36px;left:0;right:0;height:95px;background:#d9bd87;border-top:8px solid #f2dea8;box-shadow:0 -8px #c39963;z-index:0}.sun{position:absolute;right:8%;top:28px;width:57px;height:57px;border-radius:50%;background:#ffe7a2;box-shadow:0 0 50px #ffe7a280}.cloud{position:absolute;top:47px;left:16%;font-size:46px;opacity:.65}.scene-title{position:absolute;z-index:4;left:20px;top:16px;color:#244e42;font-weight:900;font-size:13px;background:#ffffffb8;padding:7px 11px;border-radius:10px}.world{position:absolute;inset:0;z-index:2}.platform{position:absolute;bottom:99px;height:22px;border-radius:9px;background:#82aa75;border:3px solid #eff0ce;box-shadow:0 5px #527e60}.p1{left:9%;width:20%}.p2{left:38%;width:20%;bottom:151px}.p3{right:7%;width:22%;bottom:108px}.crate{position:absolute;bottom:122px;left:26%;width:53px;height:53px;border:4px solid #a96736;border-radius:8px;background:linear-gradient(135deg,#d99550,#b7743c);box-shadow:inset 0 0 0 4px #e8b270,0 6px #8f5d3b}.tree{position:absolute;bottom:122px;right:10%;font-size:55px;filter:drop-shadow(0 4px #5e9863)}.goal{position:absolute;right:3.7%;bottom:151px;font-size:48px;filter:drop-shadow(0 4px 0 #b48a43);animation:bob 1.4s infinite}.character{position:absolute;left:13%;bottom:128px;width:36px;height:49px;z-index:5;transition:left .1s,bottom .12s;filter:drop-shadow(0 5px 2px #315a4166)}.character .body{position:absolute;left:7px;top:13px;width:24px;height:29px;background:#f8faf2;border-radius:12px 12px 10px 10px;border:2px solid #87a8a2}.character .head{position:absolute;left:9px;top:0;width:20px;height:19px;background:#fff;border:2px solid #87a8a2;border-radius:50%}.character .eye{position:absolute;width:3px;height:3px;background:#31544c;top:8px;left:14px;box-shadow:7px 0 #31544c}.character .arm{position:absolute;left:0;top:18px;width:10px;height:23px;background:#fff;border:2px solid #87a8a2;border-radius:9px;transform:rotate(18deg)}.character .leg{position:absolute;left:8px;bottom:0;width:10px;height:16px;background:#fff;border:2px solid #87a8a2;border-radius:8px;transform:rotate(5deg)}.character .leg.b{left:19px;transform:rotate(-9deg)}@keyframes bob{50%{transform:translateY(-9px)}}.dialogue{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:7;background:#fffefa;border:2px solid #e2ebdc;border-radius:15px;padding:10px 15px;white-space:nowrap;font-weight:800;font-size:13px;box-shadow:0 5px 15px #234d3a1a}.float{position:absolute;z-index:8;color:#fff;background:var(--green);font-weight:900;border-radius:20px;padding:5px 10px;font-size:13px;animation:up .9s forwards}@keyframes up{to{transform:translateY(-38px);opacity:0}}.under{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}.controls{font-size:12px;color:var(--muted);line-height:1.8}.controls b{color:var(--ink)}.buttons{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--green);color:#fff;font-weight:900}.btn.alt{background:#eef3e9;color:var(--green)}.side{display:flex;flex-direction:column;gap:13px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px}.card h3{font-size:13px;margin:0 0 12px}.score{font-size:32px;font-weight:900;line-height:1}.score small{font-size:13px;color:var(--muted)}.scoreline{height:7px;border-radius:9px;background:#ebf0e8;margin-top:12px;overflow:hidden}.scoreline i{display:block;height:100%;width:0;background:var(--green);transition:width .5s}.keyrow{display:flex;align-items:center;gap:10px}.keyicon{width:40px;height:40px;background:#f2f0e3;border-radius:12px;display:grid;place-items:center;font-size:22px;filter:grayscale(1);opacity:.42}.keyicon.got{filter:none;opacity:1;background:#f8edc9}.keytext{font-size:12px;color:var(--muted)}.keytext b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}.tip{font-size:12px;line-height:1.7;color:var(--muted)}.tip strong{color:var(--green)}.quiz{display:none;position:fixed;inset:0;background:#102c2588;z-index:20;align-items:center;justify-content:center;padding:18px}.quiz.open{display:flex}.quizbox{width:min(510px,100%);background:#fffefa;border-radius:22px;padding:25px;box-shadow:0 22px 80px #102c2540}.quiztop{display:flex;justify-content:space-between;align-items:center}.quiztop span{color:var(--green);font-size:11px;font-weight:900;letter-spacing:1px}.quizbox h2{margin:9px 0;font-size:22px}.quizbox p{color:var(--muted);font-size:13px;line-height:1.7}.options{display:grid;gap:9px;margin:16px 0}.option{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-weight:800}.option:hover{border-color:var(--green);background:#f2f7ee}.option.selected{border-color:var(--green);background:#edf5e9;box-shadow:inset 0 0 0 1px var(--green)}.quizresult{min-height:22px;font-size:13px;font-weight:800;color:var(--green)}.summary{display:none;margin-top:16px;background:#eaf2e7;border-radius:14px;padding:16px;line-height:1.8;font-size:13px}.summary.show{display:block}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173a32;color:white;padding:11px 16px;border-radius:12px;z-index:30;font-size:13px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}.mobile{display:none}
@media(max-width:780px){header{padding:0 16px}main{padding:21px 13px}.intro{align-items:flex-start;flex-direction:column}.intro h1{font-size:28px}.layout{grid-template-columns:1fr}.scene{height:330px}.side{display:grid;grid-template-columns:1fr 1fr}.side .card:last-child{grid-column:1/-1}.under{align-items:flex-start;flex-direction:column}.buttons{width:100%}.buttons button{flex:1}.header-right{display:none}.progress{align-self:flex-end}.dialogue{font-size:11px}.mobile{display:inline}.p1{left:4%;width:23%}.p2{left:36%;width:23%}.p3{right:3%;width:23%}}
/* Use the transparent Blender render as the moving in-game character. */
.character{width:74px;height:94px;bottom:115px;transform:translateX(-12px);background:url('assets/soft-explorer-sprite.png') center/contain no-repeat}.character>*{display:none}
</style></head>
<body><header><div class="brand"><i>🌱</i><span>錢錢大冒險</span></div><div class="header-right">邊玩邊學 · 生活理財 × 投資</div></header>
<main><div class="intro"><div><div class="tag">小小理財家 · 兩關冒險</div><h1>存下夢想，闖過難關！</h1><p>幫軟軟人跨過理財小挑戰，答對問題就能拿到關卡鑰匙。</p></div><div class="progress"><span id="step1" class="step active">01 家庭補給</span><i class="connector"></i><span id="step2" class="step">02 開店投資</span></div></div>
<div class="layout"><section class="game"><div class="scene" id="scene"><div class="sun"></div><div class="cloud">☁️</div><div class="scene-title" id="sceneTitle">第一關 · 家庭補給島</div><div class="world"><div class="platform p1"></div><div class="platform p2"></div><div class="platform p3"></div><div class="crate"></div><div class="tree">🌳</div><div class="goal" id="goal">🗝️</div><div id="player" class="character"><i class="head"></i><i class="eye"></i><i class="body"></i><i class="arm"></i><i class="leg"></i><i class="leg b"></i></div></div><div class="dialogue" id="dialogue">用 ← → 移動，靠近木箱按 E 開始挑戰</div></div>
<div class="under"><div class="controls"><b>操作</b>　← → / A D 移動　·　↑ / 空白鍵跳躍　·　<span class="mobile">畫面按鈕移動　·　</span>E 互動</div><div class="buttons"><button class="btn alt" id="leftBtn">← 左</button><button class="btn alt" id="rightBtn">右 →</button><button class="btn" id="interactBtn">互動 E</button></div></div></section>
<aside class="side"><div class="card"><h3>⭐ 本關得分</h3><div class="score"><span id="score">0</span><small> / 100</small></div><div class="scoreline"><i id="scorebar"></i></div></div><div class="card"><h3>🗝️ 關卡鑰匙</h3><div class="keyrow"><div id="keyicon" class="keyicon">🗝️</div><div class="keytext"><b id="keyname">補給島鑰匙</b><span id="keystatus">完成互動挑戰即可取得</span></div></div></div><div class="card"><h3>💡 理財小知識</h3><div class="tip" id="tip"><strong>需要先準備，想要再考慮。</strong><br>安排預算時，先留一部分儲蓄，再購買生活必需品。</div></div></aside></div>
<div class="summary" id="finalSummary"></div></main>
<div class="quiz" id="quiz"><div class="quizbox"><div class="quiztop"><span id="quiztag">關卡互動 · 理財小挑戰</span><button class="btn alt" id="closeQuiz">稍後</button></div><h2 id="qtitle"></h2><p id="qdesc"></p><div class="options" id="options"></div><div class="quizresult" id="quizresult"></div><button class="btn" id="submitAnswer">確認答案，取得鑰匙 ↗</button></div></div><div class="toast" id="toast"></div>
<script>
const qs=[
{title:'家庭補給要怎麼分配？',desc:'你有 100 元零用錢。先存下 20 元，剩下的錢要先買明天早餐需要的麵包。哪一個計畫最合適？',opts:['先買最想要的玩具，剩下再說','先存 20 元，再用 30 元買麵包，留下 50 元','把 100 元全部花在零食'],answer:1,why:'先存下部分零用錢、準備需要的早餐，還有餘額留作之後使用，讓每一筆錢都有安排。'},
{title:'小店怎樣才能穩穩賺錢？',desc:'做一杯果汁成本 20 元。顧客覺得 35 元很合理；定價太高可能賣不出去。哪個做法比較聰明？',opts:['訂價 80 元，不用管有沒有人買','先用少量材料試賣，合理定價並記錄成本和收入','借很多錢一次買滿所有材料'],answer:1,why:'小額試做、合理定價並記下成本和收入，可以觀察結果再調整。投資有風險，不保證獲利。'}];
let level=0,score=[0,0],keys=[false,false],x=13,bottom=115,near=false,answered=false,selected=-1,progress=[0,0];const $=s=>document.querySelector(s);const player=$('#player');
function render(){const second=level===1;$('#step1').className='step '+(keys[0]?'done':!second?'active':'');$('#step2').className='step '+(keys[1]?'done':second?'active':'');$('#sceneTitle').textContent=second?'第二關 · 小小商店島':'第一關 · 家庭補給島';$('#keyname').textContent=second?'商店島鑰匙':'補給島鑰匙';$('#keystatus').textContent=keys[level]?'已取得！前往終點':'完成互動挑戰即可取得';$('#keyicon').classList.toggle('got',keys[level]);$('#score').textContent=score[level];$('#scorebar').style.width=score[level]+'%';$('#goal').textContent=keys[level]?'🚪':'🗝️';$('#tip').innerHTML=second?'<strong>先了解風險，再做投資決定。</strong><br>試著小額開始、記錄收支，學到的經驗能幫助你下次調整。':'<strong>需要先準備，想要再考慮。</strong><br>安排預算時，先留一部分儲蓄，再購買生活必需品。';$('#dialogue').textContent=keys[level]?'鑰匙到手！往右走到出口完成本關。':near?'按 E 開啟理財挑戰，答對就拿鑰匙！':'用 ← → 移動，靠近木箱按 E 開始挑戰';player.style.left=x+'%';player.style.bottom=bottom+'px';}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1500)}
function move(d){if($('#quiz').classList.contains('open'))return;x=Math.max(2,Math.min(91,x+d*3.2));bottom=(x>32&&x<59)?159:115;near=!keys[level]&&x>21&&x<39;render();if(keys[level]&&x>88){if(level===0){level=1;x=12;near=false;render();toast('第一關完成！前往商店島');}else finish();}}
function jump(){if($('#quiz').classList.contains('open'))return;bottom=190;render();setTimeout(()=>{bottom=x>32&&x<59?159:115;render()},420)}
function openQuiz(){if(!near||keys[level]){toast(keys[level]?'往右前進到出口！':'再靠近木箱一點');return}answered=false;selected=-1;const q=qs[level];$('#qtitle').textContent=q.title;$('#qdesc').textContent=q.desc;$('#quiztag').textContent=`第 ${level+1} 關 · 理財互動挑戰`;$('#quizresult').textContent='';$('#submitAnswer').textContent='確認答案，取得鑰匙 ↗';$('#options').innerHTML=q.opts.map((o,i)=>`<button class="option" data-i="${i}">${o}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;document.querySelectorAll('.option').forEach(c=>c.classList.toggle('selected',c===b))});$('#quiz').classList.add('open')}
$('#submitAnswer').onclick=()=>{if(answered){if(level===0){level=1;x=12;near=false;render()}else finish();$('#quiz').classList.remove('open');return}if(selected<0){$('#quizresult').textContent='先選一個答案喔！';return}if(selected===qs[level].answer){answered=true;keys[level]=true;score[level]=100;progress[level]=1;$('#quizresult').textContent='答對了！ '+qs[level].why;$('#quizresult').style.color='var(--green)';$('#submitAnswer').textContent=level===0?'收下鑰匙，前往第二關':'收下鑰匙，前往出口';render();}else{$('#quizresult').textContent='再想一想：先照顧需要，並留意花費和風險。';$('#quizresult').style.color='var(--red)';}};
$('#closeQuiz').onclick=()=>$('#quiz').classList.remove('open');$('#interactBtn').onclick=openQuiz;$('#leftBtn').onpointerdown=e=>{e.preventDefault();move(-1)};$('#rightBtn').onpointerdown=e=>{e.preventDefault();move(1)};document.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){e.preventDefault();move(-1)}if(['ArrowRight','d','D'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowUp',' '].includes(e.key)){e.preventDefault();jump()}if(e.key==='e'||e.key==='E'||e.key==='Enter')openQuiz()});
function finish(){score[1]=100;$('#score').textContent=100;$('#scorebar').style.width='100%';$('#dialogue').textContent='冒險完成！你已經成為理財小高手。';$('#finalSummary').classList.add('show');$('#finalSummary').innerHTML=`<b>🎉 理財冒險完成！總得分 ${score[0]+score[1]} / 200</b><br>你通過了「家庭補給」與「小小商店」兩個挑戰，學會先分配預算、照顧需要，再記錄成本和收入。每一關得分：家庭補給 ${score[0]} 分・小小商店 ${score[1]} 分。<br><span style="color:#32836a;font-weight:800">進步成果：從安排零用錢，到理解小店收支與投資風險，你的理財判斷力更進一步了！</span>`;$('#goal').textContent='🏆';toast('恭喜完成兩關！')}
render();
</script></body></html>
